openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inquiries
    description: Contact inquiry operations
  - name: access-requests
    description: Portfolio access request operations
  - name: velocity-os-intakes
    description: Velocity OS operations intake requests
  - name: admin
    description: Protected owner operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a contact inquiry
      description: Stores a new contact inquiry from the website contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInquiryBody"
      responses:
        "201":
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access-requests:
    post:
      operationId: createAccessRequest
      tags: [access-requests]
      summary: Submit a portfolio access request
      description: Stores a new portfolio access request from the website modal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessRequestBody"
      responses:
        "201":
          description: Access request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /velocity-os-intakes:
    post:
      operationId: createVelocityOsIntake
      tags: [velocity-os-intakes]
      summary: Submit a Velocity OS operations intake
      description: Stores a dedicated request for help implementing an operating system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VelocityOsIntakeInput"
      responses:
        "201":
          description: Velocity OS intake created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/submissions:
    get:
      operationId: listAdminSubmissions
      tags: [admin]
      summary: Review website submissions
      description: Returns contact inquiries and portfolio access requests, newest first
      security:
        - basicAuth: []
      responses:
        "200":
          description: Website submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubmissions"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Owner access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateInquiryBody:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        organization:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        category:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - fullName
        - organization
        - email
        - category
    CreateAccessRequestBody:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        organization:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        titleRole:
          type: string
        reason:
          type: string
          minLength: 1
      required:
        - fullName
        - organization
        - email
        - reason
    VelocityOsIntakeInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        workEmail:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        titleRole:
          type: string
          minLength: 1
          maxLength: 120
        companyName:
          type: string
          minLength: 1
          maxLength: 160
        companyWebsite:
          type: string
          format: uri
          pattern: "^[hH][tT][tT][pP][sS]?://"
          maxLength: 300
        companyContext:
          type: string
          minLength: 20
          maxLength: 2000
        primaryChallenge:
          type: string
          minLength: 20
          maxLength: 2000
        desiredOutcome:
          type: string
          minLength: 20
          maxLength: 2000
        urgency:
          type: string
          enum:
            - immediate
            - this-quarter
            - next-six-months
            - exploring
      required:
        - fullName
        - workEmail
        - titleRole
        - companyName
        - companyContext
        - primaryChallenge
        - desiredOutcome
        - urgency
    ContactInquiry:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        organization:
          type: string
        email:
          type: string
          format: email
        phone:
          type: ["string", "null"]
        category:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - organization
        - email
        - phone
        - category
        - description
        - createdAt
    PortfolioAccessRequest:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        organization:
          type: string
        email:
          type: string
          format: email
        titleRole:
          type: ["string", "null"]
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - organization
        - email
        - titleRole
        - reason
        - createdAt
    AdminSubmissions:
      type: object
      properties:
        inquiries:
          type: array
          items:
            $ref: "#/components/schemas/ContactInquiry"
        accessRequests:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioAccessRequest"
      required:
        - inquiries
        - accessRequests
    SubmissionResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
      required:
        - error
