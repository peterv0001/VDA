kind = "web"
previewPath = "/"
title = "VDACQ - Van Dyke Acquisitions"
version = "1.0.0"
id = "artifacts/vdacq"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25404
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/vdacq run dev"

[services.env]
PORT = "25404"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/vdacq", "run", "build"]
publicDir = "artifacts/vdacq/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/platform"
to = "/platform/index.html"

[[services.production.rewrites]]
from = "/platform/"
to = "/platform/index.html"

[[services.production.rewrites]]
from = "/track-record"
to = "/track-record/index.html"

[[services.production.rewrites]]
from = "/track-record/"
to = "/track-record/index.html"

[[services.production.rewrites]]
from = "/team"
to = "/team/index.html"

[[services.production.rewrites]]
from = "/team/"
to = "/team/index.html"

[[services.production.rewrites]]
from = "/funding"
to = "/funding/index.html"

[[services.production.rewrites]]
from = "/funding/"
to = "/funding/index.html"

[[services.production.rewrites]]
from = "/velocity-os"
to = "/velocity-os/index.html"

[[services.production.rewrites]]
from = "/velocity-os/"
to = "/velocity-os/index.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/contact/"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/404.html"